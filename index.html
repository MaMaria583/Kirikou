<style>
  three-d-stage:not(:defined){visibility:hidden}
  html,body{height:100%}
  body{margin:0;overflow:hidden;background:var(--color-bg);color:var(--color-text)}
  three-d-stage{position:fixed;top:0;right:0;bottom:0;left:404px;width:auto;height:100vh}
  @media (max-width:900px){three-d-stage{left:0}}

  #hud{
    position:fixed;top:var(--space-4);left:var(--space-4);width:356px;
    max-height:calc(100vh - var(--space-4) * 2);overflow:auto;
    background:color-mix(in srgb, var(--color-bg) 94%, transparent);
    backdrop-filter:blur(3px);border:1px solid var(--color-divider);
    border-radius:var(--radius-md);padding:var(--space-6);box-shadow:var(--shadow-md)
  }
  .kicker{
    font-family:var(--font-heading);font-feature-settings:"tnum";
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--color-accent-700);margin:0 0 var(--space-2);
    display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-2)
  }
  #hud h1{font-size:30px;font-weight:400;margin:0;line-height:1.08}
  .lieu{font-size:12px;font-style:italic;margin:var(--space-1) 0 0;
        color:color-mix(in srgb,var(--color-text) 58%,transparent)}
  .vies{display:flex;gap:6px;align-items:center}
  .vie{width:10px;height:10px;border-radius:50%;background:var(--color-accent)}
  .vie.perdue{background:transparent;border:1px solid var(--color-neutral-400)}
  .barre{display:flex;gap:var(--space-2);align-items:center;margin:var(--space-4) 0 0}
  .pas{width:11px;height:11px;border-radius:50%;border:1px solid var(--color-accent)}
  .pas.on{background:var(--color-accent)}
  #consigne{font-size:14px;line-height:1.66;text-align:justify;hyphens:auto;margin:0}
  #note{display:block;font-size:11.5px;font-style:italic;margin-top:var(--space-2);
        color:color-mix(in srgb,var(--color-text) 55%,transparent)}
  #actions{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-4)}
  #say{font-size:13px;font-style:italic;min-height:3.1em;margin:var(--space-4) 0 0;
       text-align:justify;color:color-mix(in srgb,var(--color-text) 72%,transparent)}
  .pied{display:flex;gap:var(--space-2);margin-top:var(--space-4);flex-wrap:wrap}

  #veil{position:fixed;inset:0;display:none;place-items:center;z-index:20;padding:var(--space-6);
        background:color-mix(in srgb, var(--color-neutral-900) 60%, transparent);backdrop-filter:blur(2px);
        overflow:auto}
  #veil.on{display:grid}
  #sheet{width:min(1020px,calc(100vw - var(--space-8)));background:var(--color-bg);
         border:1px solid var(--color-divider);border-radius:var(--radius-md);
         padding:var(--space-8);box-shadow:var(--shadow-lg)}
  #sheet h2{font-size:36px;font-weight:400;margin:0 0 var(--space-2)}
  #sheet p{font-size:14.5px;line-height:1.68;text-align:justify;hyphens:auto;margin:0 0 var(--space-3)}
  #sheet ol,#sheet ul{font-size:14px;line-height:1.7;margin:0 0 var(--space-4);padding-left:var(--space-6)}
  .sheet-actions{display:flex;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--space-4)}
  .numeral{font-family:var(--font-heading);font-feature-settings:"tnum";font-size:60px;line-height:1;
           color:color-mix(in srgb,var(--color-accent) 34%,transparent);display:block;margin-bottom:var(--space-2)}
  .valeur{font-family:var(--font-heading);font-size:20px;color:var(--color-accent-700);
          margin:var(--space-4) 0 0;padding-top:var(--space-3);border-top:1px solid var(--color-divider)}

  /* carte du village */
  #carte-svg{width:100%;height:auto;display:block;margin:var(--space-4) 0 var(--space-2)}
  .lvl{cursor:pointer}
  .lvl circle{transition:fill .25s,stroke .25s,r .2s}
  .lvl .anneau{fill:none;stroke:var(--color-neutral-400);stroke-width:1.5}
  .lvl text{font-family:var(--font-heading);font-feature-settings:"tnum";font-size:12px;
            fill:var(--color-neutral-500);text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .lvl.ouvert .anneau{fill:#6d8a3c;stroke:#4f6b2c}
  .lvl.ouvert text{fill:#f8f4f4}
  .lvl.faite .anneau{fill:#4f6b2c;stroke:#3c5220}
  .lvl.faite text{fill:#f8f4f4}
  .lvl.courante .anneau{stroke:var(--color-accent);stroke-width:3}
  .lvl.verrou{cursor:not-allowed}
  .lvl.verrou .anneau{fill:var(--color-neutral-200)}
  .lvl:not(.verrou):hover .anneau{stroke:var(--color-accent);stroke-width:3}
  #legende{display:flex;gap:var(--space-4);flex-wrap:wrap;align-items:center;
           font-size:11.5px;color:color-mix(in srgb,var(--color-text) 58%,transparent);
           padding-top:var(--space-2);border-top:1px solid var(--color-divider)}
  #legende span{display:flex;gap:6px;align-items:center}
  #legende i{width:11px;height:11px;border-radius:50%;display:inline-block}
  #survol{font-family:var(--font-heading);font-size:19px;min-height:1.6em;margin:0;
          color:var(--color-text)}
  #survol em{font-family:var(--font-body);font-size:12.5px;font-style:italic;
             color:color-mix(in srgb,var(--color-text) 55%,transparent)}

  #tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .12s;z-index:6;
       font-family:var(--font-heading);font-size:13px;padding:3px 9px;
       background:var(--color-neutral-900);color:var(--color-neutral-100);
       border-radius:var(--radius-sm);transform:translate(12px,-28px)}
  #confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:25}
  .cauri{position:absolute;top:-24px;width:13px;height:9px;border-radius:50%;
         background:var(--color-accent);animation:tombe linear forwards}
  .cauri.pale{background:#efe4cf}
  @keyframes tombe{from{transform:translateY(0) rotate(0)} to{transform:translateY(105vh) rotate(540deg)}}
</style>
<style id="parure">

  :root{

  three-d-stage{border-left:1px solid color-mix(in srgb,var(--or) 35%,transparent)}

  #hud,#sheet{
    position:relative;overflow:hidden;
    background:linear-gradient(180deg,#fdf7ec 0%,var(--sable) 100%);
    border:1px solid color-mix(in srgb,var(--or) 42%,transparent);

  }
  #hud{padding-top:calc(var(--space-6) + 12px)}
  #sheet{padding-top:calc(var(--space-8) + 14px)}
  #hud::before,#sheet::before{
    content:"";position:absolute;inset:0 0 auto 0;height:12px;
    background:
      repeating-linear-gradient(90deg,
        var(--b1) 0 9px, var(--sable) 9px 13px,
        var(--b2) 13px 22px, var(--sable) 22px 26px,
        var(--b3) 26px 33px, var(--sable) 33px 37px);
    border-bottom:1px solid color-mix(in srgb,var(--or) 45%,transparent)
  }
  #hud .kicker,.kicker{color:var(--indigo);letter-spacing:.16em}
  #hud h1{color:var(--encre);letter-spacing:-.01em}
  #hud h1::after{content:"";display:block;width:52px;height:2px;margin-top:var(--space-2);
                 background:linear-gradient(90deg,var(--or),transparent)}
  .lieu{color:color-mix(in srgb,var(--encre) 62%,transparent)}
  .vies{gap:5px}
  .vie{width:14px;height:11px;border-radius:50%;position:relative;
       background:linear-gradient(180deg,#fff8ea,#e2ccA5);
       box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--or) 70%,transparent)}
  .vie::after{content:"";position:absolute;inset:3px 4px;border-radius:50%;
              background:color-mix(in srgb,var(--terre) 75%,transparent)}
  .vie.perdue{background:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--encre) 22%,transparent)}
  .vie.perdue::after{display:none}
  .pas{border-color:color-mix(in srgb,var(--or) 60%,transparent)}
  .pas.on{background:var(--or)}
  .hr{background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--or) 55%,transparent),transparent)}
  #consigne{font-size:14.5px}
  #note,#say{color:color-mix(in srgb,var(--encre) 62%,transparent)}
  .btn-primary{color:#6f4a0d;border-color:var(--or);background:#fffaf0}
  .btn-primary:hover{background:#fdf0d8}
  .btn-secondary{border-color:color-mix(in srgb,var(--encre) 22%,transparent);background:#fffdf8}
  .btn-secondary:hover{background:#f7ecd9}
  #sheet h2{color:var(--encre)}
  .numeral{color:color-mix(in srgb,var(--or) 46%,transparent)}
  .valeur{color:#6f4a0d;border-top-color:color-mix(in srgb,var(--or) 45%,transparent)}
  #veil{background:color-mix(in srgb,#2a1c0e 66%,transparent)}

  /* ── la carte ── */
  #cartouche{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4);
             border-bottom:1px solid color-mix(in srgb,var(--or) 45%,transparent);
             padding-bottom:var(--space-2);margin-bottom:var(--space-3)}
  #cartouche p{margin:0;font-size:13px;font-style:italic;
               color:color-mix(in srgb,var(--encre) 60%,transparent)}
  #carte-svg{width:100%;height:auto;display:block;margin:0 0 var(--space-3)}
  .lvl circle,.lvl text{transition:fill .25s,stroke .25s}
  .lvl .plaque{fill:#e4d4b8;stroke:#a98a5c;stroke-width:1.5}
  .lvl .anneau{fill:none;stroke:none}
  .lvl text{font-family:var(--font-heading);font-feature-settings:"tnum";font-size:16px;
            font-weight:600;fill:#8a7147;text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .lvl.ouvert .plaque{fill:#6d8a3c;stroke:#40542a}
  .lvl.ouvert text{fill:#f7f2e4}
  .lvl.faite .plaque{fill:#3f5528;stroke:#2c3c1c}
  .lvl.faite text{fill:#e8c27a}
  .lvl.courante .plaque{stroke:var(--or);stroke-width:3.5}
  .lvl.courante .halo{fill:none;stroke:var(--or-clair);stroke-width:1.5;opacity:.9}
  .lvl:not(.verrou){cursor:pointer}

  .lvl:not(.verrou):hover .plaque{stroke:var(--or);stroke-width:3.5}
  #legende{border-top:1px solid color-mix(in srgb,var(--or) 40%,transparent);
           color:color-mix(in srgb,var(--encre) 60%,transparent)}
  #legende i{box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
  #survol{color:var(--encre)}
  #survol em{color:color-mix(in srgb,var(--encre) 58%,transparent)}

  /* ── nuit ── */
  body.sombre{color:#eadfcd}
  body.sombre #hud,body.sombre #sheet{
    background:linear-gradient(180deg,#241b13 0%,#1a1410 100%);

  body.sombre .btn-secondary{border-color:rgba(234,223,205,.26);background:rgba(234,223,205,.06)}
  body.sombre .btn-secondary:hover{background:rgba(234,223,205,.14)}
  body.sombre .vie{background:linear-gradient(180deg,#f6ecd9,#c9ab7c)}
  body.sombre .pas{border-color:var(--or-clair)}
  body.sombre .pas.on{background:var(--or-clair)}
  body.sombre .valeur{color:#f0c987}
  body.sombre .numeral{color:color-mix(in srgb,var(--or-clair) 40%,transparent)}
  body.sombre #veil{background:color-mix(in srgb,#000 72%,transparent)}
  body.sombre .text-muted{color:color-mix(in srgb,#eadfcd 52%,transparent)}
</style>
<style id="mobile">
  /* ── Adaptation mobile : la scène 3D occupe tout l'écran, le panneau
        devient une « feuille » en bas qu'on peut replier pour voir et
        toucher les objets de la case. ── */
  #hud-poignee{display:none}                 /* masquée hors mobile */

  @media (max-width:900px){
    three-d-stage{left:0}

    #hud{
      position:fixed !important;
      inset:auto 0 0 0;                       /* collé en bas, pleine largeur */
      width:auto !important; max-width:none;
      max-height:56vh !important;
      overflow:auto !important;
      border-radius:16px 16px 0 0;
      padding:4px var(--space-4) calc(var(--space-4) + env(safe-area-inset-bottom));
      box-shadow:0 -12px 30px -14px rgba(60,38,16,.55);
      -webkit-overflow-scrolling:touch;
      transition:max-height .3s ease;
    }
    #hud::before{display:none}                /* le bandeau cède la place à la poignée */

    #hud-poignee{
      display:flex;flex-direction:column;align-items:center;gap:4px;
      position:sticky;top:0;z-index:3;
      width:100%;border:0;background:transparent;cursor:pointer;
      padding:6px 0 8px;margin:0;font:inherit;color:inherit;
      -webkit-tap-highlight-color:transparent;
    }
    #hud-poignee .grip{
      width:44px;height:4px;border-radius:999px;
      background:color-mix(in srgb,var(--or) 60%,transparent);
    }
    #hud-poignee .poignee-txt{
      font-family:var(--font-heading);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
      color:color-mix(in srgb,var(--encre) 55%,transparent);
    }
    body.sombre #hud-poignee .poignee-txt{color:color-mix(in srgb,#eadfcd 55%,transparent)}

    /* replié : ne montre que la poignée + un aperçu de l'en-tête */
    body.hud-plie #hud{max-height:72px !important;overflow:hidden !important}

    #defi{white-space:normal}                 /* évite le débordement horizontal */
    #consigne,#say,#sheet p,.lede{text-align:left}
  }
</style>

<script type="module">
import * as THREE from 'three';
import { LIEUX, buildNaba, mat, mesh } from './village-lieux.js';

const stage = document.querySelector('three-d-stage');
await stage.ready;
stage.shadowRoot.querySelectorAll('.toolbar,.note').forEach(n => n.remove());

/* ═══════ le catalogue des jeux ═══════ */
const TOUS = [
  { n: 1, lieu: 'case', titre: 'Les cinq indices', mec: 'trouve', valeur: 'Le partage',
    intro: 'Le vieux Karfa a laissé un trésor sous sa case. Il a caché cinq indices dans la maison. Naba cherche pour toi : touche l’objet dont parle l’indice.',
    etapes: [
      { id: 'djembe', t: 'Le griot frappe dessus pour appeler tout le village. Sa peau parle avant les hommes.', r: 'Le djembé, tambour du Mali et de la Guinée.' },
      { id: 'jarre', t: 'Elle est en terre cuite, elle garde l’eau bien fraîche même quand le soleil tape fort.', r: 'Le canari : l’eau s’évapore un peu et refroidit la jarre.' },
      { id: 'mortier', t: 'Chaque matin, le bois chante&nbsp;: le grain tombe dedans et ressort en farine.', r: 'Le mortier et le pilon — le mil du Sahel.' },
      { id: 'masque', t: 'Un visage de bois accroché au mur&nbsp;: il ne dort jamais et il garde la case.', r: 'Le masque des ancêtres, gardien de la maison.' },
      { id: 'foyer', t: 'Trois pierres, un seul feu. C’est ici qu’on partage le repas du soir.', r: 'Les trois pierres du foyer, autour desquelles la famille se réunit.' },
    ] },
  { n: 2, lieu: 'case', titre: 'Le tambour parleur', mec: 'memoire', valeur: 'Le respect des aînés', nuit: true,

const N = buildNaba();
const naba = N.group;
const walk = { on: false, from: new THREE.Vector3(), to: new THREE.Vector3(), t: 0, dur: 1, done: null };
let kneel = 0, kneelTo = 0, solY = 0, feu = null;
function goTo(x, z, done) {
  walk.from.copy(naba.position); walk.to.set(x, solY, z);
  walk.dur = Math.max(0.4, walk.from.distanceTo(walk.to) / 1.6);
  walk.t = 0; walk.on = true; walk.done = done;
  // filet de sécurité : si les images s'arrêtent (onglet en arrière-plan),
  // on termine le déplacement quand même pour ne pas bloquer le jeu.
  clearTimeout(walk.secours);
  walk.secours = setTimeout(() => {
    if (!walk.on) return;
    walk.on = false; naba.position.copy(walk.to);
    N.jambeG.rotation.x = N.jambeD.rotation.x = 0;
    N.brasG.rotation.x = N.brasD.rotation.x = 0;
    const d = walk.done; walk.done = null; d && d();
  }, walk.dur * 1000 + 600);
}
const faceTo = (x, z) => { naba.rotation.y = Math.atan2(x - naba.position.x, z - naba.position.z); };
let last = performance.now();
(function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (walk.on) {
    walk.t += dt / walk.dur;
    const k = Math.min(1, walk.t);
    naba.position.lerpVectors(walk.from, walk.to, k);
    faceTo(walk.to.x, walk.to.z);
    const sw = Math.sin(now / 90) * 0.55;
    N.jambeG.rotation.x = sw; N.jambeD.rotation.x = -sw;
    N.brasG.rotation.x = -sw * 0.8; N.brasD.rotation.x = sw * 0.8;
    naba.position.y = solY + Math.abs(Math.sin(now / 90)) * 0.02;
    if (k >= 1) {
      walk.on = false; clearTimeout(walk.secours);
      N.jambeG.rotation.x = N.jambeD.rotation.x = 0;
      N.brasG.rotation.x = N.brasD.rotation.x = 0; naba.position.y = solY;
      const d = walk.done; walk.done = null; d && d();
    }
  } else naba.position.y = solY + Math.sin(now / 620) * 0.006;
  kneel += (kneelTo - kneel) * Math.min(1, dt * 6);
  if (feu && feu.visible) {
    feu.intensity = 2.2 + Math.sin(now / 90) * 0.5 + Math.random() * 0.4;
    mat.braise.emissiveIntensity = 0.7 + Math.random() * 0.5;
  }
  naba.scale.y = 1 - kneel * 0.28;
  if (!walk.on) N.brasG.rotation.x = N.brasD.rotation.x = -kneel * 1.5;
  requestAnimationFrame(tick);
})(performance.now());

function camTo(p, t, ms = 1000) {
  const cam = stage._camera, ctr = stage._controls;
  const p0 = cam.position.clone(), t0 = ctr.target.clone(), t1 = performance.now();
  (function step() {
    const k = Math.min(1, (performance.now() - t1) / ms), e = k < 0.5 ? 2 * k * k : 1 - 2 * (1 - k) ** 2;
    cam.position.lerpVectors(p0, p, e); ctr.target.lerpVectors(t0, t, e);
    if (k < 1) requestAnimationFrame(step);
  })();
}

/* ═══════ son ═══════ */
let ac = null;
const audio = () => (ac = ac || new (window.AudioContext || window.webkitAudioContext)());
function drum(freq = 170, gain = 0.45) {
  const c = audio(), t = c.currentTime, o = c.createOscillator(), g = c.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(freq * 1.6, t); o.frequency.exponentialRampToValueAtTime(freq, t + 0.14);
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + 0.45);
}
function chime(up = true) {
  const c = audio(), t = c.currentTime;
  [0, 0.12].forEach((d, i) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle'; o.frequency.value = up ? [523, 784][i] : [330, 196][i];
    g.gain.setValueAtTime(0.2, t + d); g.gain.exponentialRampToValueAtTime(0.001, t + d + 0.5);
    o.connect(g).connect(c.destination); o.start(t + d); o.stop(t + d + 0.55);
  });
}
function thud() {
  const c = audio(), t = c.currentTime, o = c.createOscillator(), g = c.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.5);
  g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + 0.75);
}
function applaudissements(dur = 5) {
  const c = audio(), sr = c.sampleRate, buf = c.createBuffer(2, sr * dur, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < d.length; i++) {
      const s = i / sr, sw = Math.min(1, s / 0.5) * Math.min(1, (dur - s) / 1.2);
      d[i] = (Math.random() * 2 - 1) * 0.15 * sw;
    }
    for (let n = 0; n < dur * 180; n++) {
      const at = Math.floor(Math.random() * (d.length - 900)), amp = 0.35 + Math.random() * 0.65;
      const s = at / sr, sw = Math.min(1, s / 0.5) * Math.min(1, (dur - s) / 1.2);
      for (let i = 0; i < 700; i++) d[at + i] += (Math.random() * 2 - 1) * amp * Math.exp(-i / 110) * 0.5 * sw;
    }
  }
  const src = c.createBufferSource(); src.buffer = buf;
  const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = 0.55;
  const g = c.createGain(); g.gain.value = 0.9;
  src.connect(bp).connect(g).connect(c.destination); src.start();
  [0, 0.34, 0.62].forEach((d, i) => setTimeout(() => drum([150, 190, 120][i], 0.4), d * 1000));
}
function cauris(n = 80) {

}

const cache = {};
let lieuActif = null, spots = {};
function chargerLieu(clef) {
  if (!cache[clef]) cache[clef] = LIEUX[clef].build();
  const L = cache[clef];
  if (lieuActif === L) return L;
  if (lieuActif) lieuActif.group.remove(naba);
  lieuActif = L; spots = L.spots;
  L.group.add(naba);
  solY = L.nabaStart[1];
  naba.position.set(L.nabaStart[0], solY, L.nabaStart[2]);
  naba.rotation.y = Math.PI; kneelTo = 0;
  stage.setObject(L.group);
  const lum = L.group.getObjectByName('lumiere_douce') || (() => {
    const d = new THREE.DirectionalLight(0xfff2e2, 0.85); d.name = 'lumiere_douce';
    d.position.set(0.6, 9, 0.8); L.group.add(d); return d;
  })();
  lum.visible = true;
  camTo(new THREE.Vector3(...L.cam.pos), new THREE.Vector3(...L.cam.target), 1100);
  Object.values(spots).forEach(s => { s.userData.halo.visible = false; });
  if (L.group.userData.toit) L.group.userData.toit.position.y = 4.6;
  if (L.group.userData.tresor) {
    L.group.userData.tresor.visible = false;
    L.group.userData.cendres.visible = true; L.group.userData.marmite.visible = true;
  }
  if (L.group.userData.chevreau) L.group.userData.chevreau.visible = false;
  return L;
}

function ecranCarte() {
  sauve = lire();
  const cx = 500, cy = 335, rx = 456, ry = 280;
  const dots = NIVEAUX.map((d, i) => {
    const a = -Math.PI / 2 + i * (Math.PI * 2 / NIVEAUX.length);
    const x = (cx + Math.cos(a) * rx).toFixed(1), y = (cy + Math.sin(a) * ry).toFixed(1);
    const fait = (sauve.faits || []).includes(d.n);
    const ouvert = d.n <= sauve.max && !d.bientot;
    const cls = ['lvl', fait ? 'faite' : ouvert ? 'ouvert' : 'verrou', d.n === sauve.max ? 'courante' : ''].join(' ');
    return `<g class="${cls}" data-n="${d.n}" data-titre="${d.titre}" data-lieu="${NOM_LIEU[d.lieu]}${d.bientot ? ' · bientôt' : ''}">
      <title>${String(d.n).padStart(2, '0')} — ${d.titre} (${NOM_LIEU[d.lieu]})</title>
      ${d.n === sauve.max ? `<circle class="halo" cx="${x}" cy="${y}" r="28"></circle>` : ''}
      <circle class="plaque" cx="${x}" cy="${y}" r="21"></circle>
      <text x="${x}" y="${y}">${String(d.n).padStart(2, '0')}</text></g>`;
  }).join('');
  const trail = `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none"
    stroke="#b68235" stroke-width="1.4" stroke-dasharray="2 9" opacity=".7"/>`;
  sheet(`<span class="numeral">${String(Math.min(sauve.max, NIVEAUX.length)).padStart(2, '0')}</span>
    <div id="cartouche"><h2>La carte du village</h2>
      <p>seize jeux autour du village</p></div>
    <svg id="carte-svg" viewBox="0 0 1000 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carte du village avec les seize niveaux">
      <style>.etiq{font-family:var(--font-body);font-size:12.5px;font-style:italic;fill:#6f5836;text-anchor:middle}</style>
      ${VILLAGE_SVG}
      ${trail}
      ${dots}
    </svg>
    <p id="survol">Touche un jeton vert<em> — les jetons de terre s’ouvriront après tes réussites.</em></p>
    <div id="legende">
      <span><i style="background:#6d8a3c"></i> ouvert</span>
      <span><i style="background:#3f5528"></i> réussi</span>
      <span><i style="background:#e4d4b8"></i> fermé</span>
      <span><i style="box-shadow:inset 0 0 0 3px var(--or)"></i> ton niveau</span>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-primary" id="jouer" type="button">Jouer le niveau ${String(Math.min(sauve.max, NIVEAUX.length)).padStart(2, '0')}</button>
    </div>`);
  const survol = $('survol');
  $('carte-svg').querySelectorAll('.lvl').forEach(g => {
    const n = +g.dataset.n;
    g.addEventListener('mouseenter', () => {
      survol.innerHTML = `${String(n).padStart(2, '0')} — ${g.dataset.titre}<em> — ${g.dataset.lieu}</em>`;
    });
    g.addEventListener('click', () => {
      if (g.classList.contains('verrou')) {
        survol.innerHTML = `Ce jeu s’ouvrira plus tard<em> — réussis d’abord le niveau ${String(sauve.max).padStart(2, '0')}.</em>`;
        return;
      }
      fermer(); lancer(n);
    });
  });
  $('jouer').onclick = () => { fermer(); lancer(Math.min(sauve.max, NIVEAUX.length)); };
}
function ecranIntro(d) {
  sheet(`<span class="numeral">${String(d.n).padStart(2, '0')}</span>
    <h2>${d.titre}</h2>
    <p>${d.intro}</p>
    <ul>
      <li>Lieu : <em>${NOM_LIEU[d.lieu]}</em>, ${(AMB[d.n] || AMB[1]).nom}</li>
      <li>Défi : <strong>${defiDe(d)}</strong></li>
      <li>Vies : <strong>${viesDe(d.n)}</strong> — au bout, le niveau recommence.</li>
    </ul>
    <div class="sheet-actions"><button class="btn btn-primary" id="ok" type="button">C’est parti</button>
    <button class="btn btn-secondary" id="ret" type="button">Retour à la carte</button></div>`);
  $('ok').onclick = () => { fermer(); demarrer(); };
  $('ret').onclick = () => { fermer(); ecranCarte(); };
}
function ecranReussite() {
  const d = J.niv;
  const suivant = NIVEAUX.find(x => x.n === d.n + 1);
  applaudissements(5); cauris(90);
  sauve = lire();
  sauve.faits = [...new Set([...(sauve.faits || []), d.n])];
  sauve.max = Math.max(sauve.max, Math.min(d.n + 1, NIVEAUX.length));
  ecrire(sauve);
  sheet(`<span class="numeral">✓</span>
    <h2>Bravo Naba !</h2>
    <p>Le village applaudit. ${d.n === NIVEAUX.length ? 'Seize jeux, seize leçons : Naba est devenu le gardien du village.' : 'Un nouveau jeu s’ouvre sur la carte.'}</p>
    <p class="valeur">La valeur de ce jeu : ${d.valeur.toLowerCase()}.</p>
    <div class="sheet-actions">
      ${suivant && !suivant.bientot ? `<button class="btn btn-primary" id="suite" type="button">Niveau ${String(suivant.n).padStart(2, '0')} — ${suivant.titre}</button>` : ''}
      <button class="btn btn-secondary" id="carte2" type="button">Carte du village</button>
    </div>
    ${suivant && suivant.bientot ? '<p class="text-muted">Le niveau suivant arrive dans le prochain lot.</p>' : ''}`);
  const s = $('suite'); if (s) s.onclick = () => { fermer(); lancer(d.n + 1); };
  $('carte2').onclick = () => { fermer(); ecranCarte(); };
}
function ecranEchec(msg) {
  thud();
  sheet(`<span class="numeral">✕</span>
    <h2>Raté</h2>
    <p>${msg}</p>
    <p>Plus de vie pour ce jeu : Naba recommence le niveau ${String(J.niv.n).padStart(2, '0')} depuis le début. Ta progression sur la carte est gardée.</p>
    <div class="sheet-actions"><button class="btn btn-primary" id="re" type="button">Recommencer</button>
    <button class="btn btn-secondary" id="carte3" type="button">Carte du village</button></div>`);
  $('re').onclick = () => { fermer(); demarrer(); };
  $('carte3').onclick = () => { fermer(); ecranCarte(); };
}

/* ═══════ moteur ═══════ */
function lancer(n) {
  const d = NIVEAUX.find(x => x.n === n);
  if (!d || d.bientot) { ecranCarte(); return; }
  J.niv = d; J.vies = viesDe(n); J.pas = 0; J.busy = false;
  chargerLieu(d.lieu);
  appliquerAmbiance(d.n);
  majHud(); boutons([]); consigne('—'); dire('');
  ecranIntro(d);
}
function perdreUneVie(msg) {
  J.vies--; majHud();
  if (J.vies <= 0) { J.phase = 'perdu'; setTimeout(() => ecranEchec(msg), 700); }
  else { thud(); dire(msg + ' Il te reste ' + J.vies + (J.vies > 1 ? ' vies.' : ' vie.')); }
  return J.vies > 0;
}
function demarrer() {
  const d = J.niv;
  J.tour++;
  J.vies = viesDe(d.n); J.pas = 0; J.busy = false;
  chargerLieu(d.lieu);
  appliquerAmbiance(d.n);
  Object.values(spots).forEach(s => { s.userData.halo.visible = false; });
  if (d.mec === 'trouve') startTrouve();
  else if (d.mec === 'memoire') startMemoire();
  else if (d.mec === 'compte' || d.mec === 'quiz' || d.mec === 'troc') startQuestions();
  else if (d.mec === 'cache') startCache();
  else if (d.mec === 'ordre') startOrdre();
  else if (d.mec === 'intrus') startIntrus();
  majHud();
}

/* ── trouve ── */
function startTrouve() {
  J.phase = 'trouve'; J.total = J.niv.etapes.length; J.pas = 0;
  majHud(); boutons([]); montrerEtape();
  dire('Touche l’objet dont parle l’indice.');
}
function montrerEtape() {
  const e = J.niv.etapes[J.pas];
  if (e) consigne(e.t, e.r);
}
function toucheTrouve(id) {
  const e = J.niv.etapes[J.pas];
  J.busy = true;
  const p = spots[id].position;
  const cx = p.x * 0.6, cz = p.z * 0.6 + (p.z > 0 ? 0.2 : -0.05);
  goTo(cx, cz, () => {
    faceTo(p.x, p.z);
    if (id === e.id) {
      drum(180); chime(true);
      spots[id].userData.halo.visible = true;
      J.pas++; majHud();
      if (J.pas >= J.niv.etapes.length) {
        kneelTo = 1;
        setTimeout(() => {
          const u = lieuActif.group.userData;
          if (u.tresor) { u.tresor.visible = true; u.cendres.visible = false; u.marmite.visible = false; }
          if (u.recompense) u.recompense.visible = true;
          dire(u.tresor ? 'La terre cède : la jarre de cauris est là !' : 'Le forgeron sourit et lui offre un bracelet d’or.');
          setTimeout(ecranReussite, 1100);
        }, 800);
      } else { montrerEtape(); dire('Bien vu ! Naba trouve le mot suivant.'); J.busy = false; }
    } else {
      const reste = perdreUneVie(`Rien ici.`);
      J.busy = false;
      if (!reste) return;
    }
  });
}

/* ── mémoire ── */
let suite = [], saisie = 0, manche = 0;
function startMemoire() {
  manche = 0; J.total = J.niv.manches.length; J.pas = 0; majHud();
  boutons([]); joueManche();
}
function joueManche() {
  J.phase = 'demo'; J.busy = true; saisie = 0;
  const n = J.niv.manches[manche];
  consigne(`Manche ${manche + 1} sur ${J.niv.manches.length} — ${n} objets. Écoute le tambour, puis touche les objets dans le même ordre.`, J.niv.note);
  suite = Array.from({ length: n }, () => J.niv.pool[Math.floor(Math.random() * J.niv.pool.length)]);
  dire('Écoute bien…');
  const t = J.tour;
  suite.forEach((id, i) => setTimeout(() => {
    if (J.tour !== t) return;
    const p = spots[id].position; faceTo(p.x, p.z); drum(TONS[id] || 200);
    spots[id].userData.halo.visible = true;
    setTimeout(() => { spots[id].userData.halo.visible = false; }, 460);
  }, 650 + i * 760));
  setTimeout(() => {
    if (J.tour !== t) return;
    J.phase = 'saisie'; J.busy = false; dire('À toi de jouer !');
  }, 650 + suite.length * 760 + 300);
}
const TONS = { djembe: 150, mortier: 200, jarre: 262, masque: 330, tabouret: 392, awale: 440, natte: 494, calebasse: 587 };
function toucheMemoire(id) {
  const attendu = suite[saisie];
  const p = spots[id].position; faceTo(p.x, p.z);
  if (id === attendu) {
    drum(TONS[id] || 200); spots[id].userData.halo.visible = true;
    setTimeout(() => { spots[id].userData.halo.visible = false; }, 300);
    saisie++;
    if (saisie >= suite.length) {
      J.busy = true; chime(true); manche++; J.pas = manche; majHud();
      if (manche >= J.niv.manches.length) { J.phase = 'gagne'; dire('Sans faute !'); setTimeout(ecranReussite, 800); }
      else { const t = J.tour; dire('Manche réussie. Le tambour reprend, plus long.'); setTimeout(() => { if (J.tour === t) joueManche(); }, 1400); }
    } else dire(`${saisie} sur ${suite.length}…`);
  } else {
    J.busy = true;
    const reste = perdreUneVie(`Le tambour avait dit ${LABEL(attendu)}.`);
    if (reste) { const t = J.tour; dire($('say').innerHTML + ' On réécoute.'); setTimeout(() => { if (J.tour === t) joueManche(); }, 1400); }
  }
}
const LABEL = id => (spots[id] ? spots[id].userData.label : id);

/* ── compte / quiz (questions) ── */
let qi = 0;
function startQuestions() {
  qi = 0; J.total = J.niv.questions.length; J.pas = 0; J.phase = 'question'; majHud();
  poserQuestion();
}
function poserQuestion() {
  const q = J.niv.questions[qi];
  Object.values(spots).forEach(s => { s.userData.halo.visible = false; });
  if (q.spot && spots[q.spot]) {
    const sp = spots[q.spot];
    if (sp.userData.halo) sp.userData.halo.visible = true;
    const p = sp.position;
    if (J.niv.mec === 'compte') { faceTo(p.x, p.z); }
  }
  consigne(q.q, q.note || '');
  dire(`Question ${qi + 1} sur ${J.niv.questions.length}.`);
  boutons(q.options.map((o, i) => [o, () => repondre(i), 'btn-secondary']));
}
function repondre(i) {
  if (J.busy) return;
  const q = J.niv.questions[qi];
  if (i === q.bonne) {
    chime(true); J.pas = ++qi; majHud();
    if (qi >= J.niv.questions.length) {
      J.busy = true; boutons([]); dire('Toutes les réponses sont justes !');
      setTimeout(ecranReussite, 700);
    } else { dire('Juste !'); poserQuestion(); }
  } else {
    const reste = perdreUneVie('Ce n’est pas ça.');
    if (reste) poserQuestion();
    else boutons([]);
  }
}

/* ── ordre du rituel ── */
let ordreI = 0;
function startOrdre() {
  J.phase = 'ordre'; J.total = J.niv.suite.length; J.pas = 0; ordreI = 0; J.busy = false;
  majHud(); boutons([]);
  consigne(J.niv.etapesTexte.map((t, i) => `${i + 1}. ${t}`).join('<br>'), J.niv.note);
  dire('Touche les objets dans cet ordre.');
}
function toucheOrdre(id) {
  const attendu = J.niv.suite[ordreI];
  J.busy = true;
  const p = spots[id].position;
  goTo(p.x * 0.7, p.z * 0.7 + (p.z > 0 ? 0.2 : -0.05), () => {
    faceTo(p.x, p.z);
    if (id === attendu) {
      drum(TONS[id] || 190 + ordreI * 40); chime(true);
      spots[id].userData.halo.visible = true;
      ordreI++; J.pas = ordreI; majHud();
      if (ordreI >= J.niv.suite.length) {
        J.phase = 'gagne'; dire('Le grain est au grenier. Tout le village a aidé !');
        setTimeout(ecranReussite, 1000);
      } else { dire(`Étape ${ordreI} faite. Au suivant.`); J.busy = false; }
    } else {
      const reste = perdreUneVie(`Pas encore ça : c’était ${LABEL(attendu)}.`);
      ordreI = 0; J.pas = 0; majHud();
      Object.values(spots).forEach(s => { s.userData.halo.visible = false; });
      J.busy = false;
      if (reste) dire($('say').innerHTML + ' On reprend à la première étape.');
    }
  });
}

/* ── trouve l’intrus ── */
let intrusI = 0;
function startIntrus() {
  J.phase = 'intrus'; J.total = J.niv.manches.length; J.pas = 0; intrusI = 0; J.busy = false;
  majHud(); boutons([]); poserIntrus();
}
function poserIntrus() {
  const m = J.niv.manches[intrusI];
  Object.values(spots).forEach(s => { s.userData.halo.visible = false; });
  m.options.forEach(id => { if (spots[id]) spots[id].userData.halo.visible = true; });
  consigne(`${m.q}<br>${m.options.map(LABEL).join(' · ')}`, J.niv.note);
  dire(`Question ${intrusI + 1} sur ${J.niv.manches.length}. Touche l’intrus.`);
  J.busy = false;
}
function toucheIntrus(id) {
  const m = J.niv.manches[intrusI];
  if (!m.options.includes(id)) { dire('Choisis parmi les objets cités dans la question.'); return; }
  J.busy = true;
  const p = spots[id].position;
  goTo(p.x * 0.7, p.z * 0.7 + (p.z > 0 ? 0.2 : -0.05), () => {
    faceTo(p.x, p.z);
    if (id === m.intrus) {
      chime(true); drum(240);
      Object.values(spots).forEach(s => { s.userData.halo.visible = false; });
      spots[id].userData.halo.visible = true;
      intrusI++; J.pas = intrusI; majHud();
      if (intrusI >= J.niv.manches.length) {
        J.phase = 'gagne'; dire('Bien vu ! ' + m.pourquoi);
        setTimeout(ecranReussite, 1200);
      } else { const t = J.tour; dire(m.pourquoi); J.busy = false; setTimeout(() => { if (J.tour === t) poserIntrus(); }, 1600); }
    } else {
      const reste = perdreUneVie('Non, celui-là va avec les autres.');
      J.busy = false;
      if (reste) dire($('say').innerHTML + ' Regarde encore.');
    }
  });
}

/* ── cachette ── */
let cachettes = [], bonne = null;
function startCache() {
  manche = 0; J.total = J.niv.manches.length; J.pas = 0; majHud(); placerChevreau();
}
function placerChevreau() {
  J.phase = 'cache'; J.busy = false;
  const toutes = lieuActif.group.userData.cachettes;
  const n = J.niv.manches[manche];
  cachettes = toutes.slice(0, n);
  bonne = cachettes[Math.floor(Math.random() * cachettes.length)];
  const ch = lieuActif.group.userData.chevreau;
  ch.visible = false;
  const p = spots[bonne].position;
  ch.position.set(p.x + 0.25, lieuActif.nabaStart[1], p.z + 0.2);
  const bete = J.niv.bete || 'le chevreau';
  cachettes.forEach(id => { spots[id].userData.halo.visible = true; });
  consigne(`Manche ${manche + 1} sur ${J.niv.manches.length} — ${bete} est dans une de ces ${n} cachettes : ${cachettes.map(LABEL).join(', ')}. Touche celle que tu choisis.`, J.niv.note);
  dire('Écoute… on l’entend à peine.');
  drum(300, 0.18);
}
function toucheCache(id) {
  if (!cachettes.includes(id)) { dire('Ce n’est pas une cachette. Regarde la liste.'); return; }
  J.busy = true;
  const p = spots[id].position;
  goTo(p.x * 0.72, p.z * 0.72, () => {
    faceTo(p.x, p.z);
    if (id === bonne) {
      const ch = lieuActif.group.userData.chevreau;
      ch.visible = true; chime(true); drum(320, 0.3);
      spots[id].userData.halo.visible = true;
      manche++; J.pas = manche; majHud();
      if (manche >= J.niv.manches.length) {
        J.phase = 'gagne'; dire('Trouvé ! Vous rentrez ensemble.');
        setTimeout(ecranReussite, 1000);
      } else { const t = J.tour; dire('Trouvé ! Mais il se cache encore une fois…'); setTimeout(() => { if (J.tour !== t) return; ch.visible = false; placerChevreau(); }, 1600); }
    } else {
      const reste = perdreUneVie('Personne dans cette cachette.');
      J.busy = false;
      if (reste) dire($('say').innerHTML + ' Essaie une autre cachette.');
    }
  });
}

/* ═══════ pointeur ═══════ */
const dom = stage._renderer.domElement, ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const tip = $('tip');
function viser(ev) {
  const r = dom.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, stage._camera);
  const hit = ray.intersectObjects(Object.values(spots), true)[0];
  if (!hit) return null;
  let o = hit.object;
  while (o && !o.userData.hotspot) o = o.parent;
  return o;
}
const cliquable = () => !J.busy && ['trouve', 'saisie', 'cache', 'ordre', 'intrus'].includes(J.phase);
let down = null;
dom.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
dom.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved > 6 || !cliquable()) return;
  const o = viser(e); if (!o) return;
  const id = o.userData.hotspot;
  if (J.phase === 'trouve') toucheTrouve(id);
  else if (J.phase === 'saisie') toucheMemoire(id);
  else if (J.phase === 'cache') toucheCache(id);
  else if (J.phase === 'ordre') toucheOrdre(id);
  else if (J.phase === 'intrus') toucheIntrus(id);
});
dom.addEventListener('pointermove', e => {
  const o = cliquable() ? viser(e) : null;
  dom.style.cursor = o ? 'pointer' : '';
  tip.style.opacity = o ? '1' : '0';
  if (o) { tip.textContent = o.userData.label; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; }
});

$('btn-carte').onclick = ecranCarte;
$('btn-rejouer').onclick = () => { if (J.niv) demarrer(); };

/* ═══════ départ ═══════ */
chargerLieu('case');
J.niv = NIVEAUX[0]; J.vies = 1; J.total = 3; majHud();
consigne('Seize jeux dans le village : la case, le champ, l’enclos, l’arbre à palabres, le marché, la forêt, la mare, le grenier, la forge et l’école. Ouvre la carte et commence par le premier.');
ecranCarte();
window.__dbg = { J, lancer, demarrer, camTo, lieu: () => lieuActif, spots: () => spots, touche: id => {
  if (J.phase === 'trouve') toucheTrouve(id);
  else if (J.phase === 'saisie') toucheMemoire(id);
  else if (J.phase === 'cache') toucheCache(id);
  else if (J.phase === 'ordre') toucheOrdre(id);
  else if (J.phase === 'intrus') toucheIntrus(id);
}, repondre, suite: () => suite, bonne: () => bonne };
</script>
<script>
  /* Panneau mobile : la poignée plie/déplie la feuille du bas
     pour dégager la scène 3D et pouvoir toucher les objets. */
  (function () {
    var hud = document.getElementById('hud');
    var p = document.getElementById('hud-poignee');
    if (hud && p) {
      var txt = p.querySelector('.poignee-txt');
      var set = function (plie) {
        document.body.classList.toggle('hud-plie', plie);
        p.setAttribute('aria-expanded', String(!plie));
        if (txt) txt.textContent = plie ? 'Ouvrir' : 'Réduire';
        if (!plie) hud.scrollTop = 0;
      };
      p.addEventListener('click', function () {
        set(!document.body.classList.contains('hud-plie'));
      });
    }
  })();

  /* Enregistrement du service worker — rend l'app installable + hors-ligne. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
